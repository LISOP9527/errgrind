[project]
name = "errgrind"
version = "0.1.0"
description = "通过用户使用过程中的 Evidence 建立用户的 Thinking Model（认知模型），识别可能导致未来 Error 的 Pattern，并利用这个 Model 持续帮助用户优化，从而减少未来的 Error。"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
# The SDK pins a platform-specific Codex runtime.  Keep it optional so an
# unsupported runtime wheel does not prevent Gemini/DeepSeek/OpenCode users
# from installing ErrGrind at all.  install.sh enables this extra whenever the
# matching runtime is available.
codex = ["openai-codex==0.147.0", "httpx[socks]>=0.27.0"]

[project.scripts]
errgrind = "errgrind.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
